<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Esta frecuencia no existe · Biblioteca en onda corta</title>
<link rel="icon" href="/SalaInfantil/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;
    background:radial-gradient(800px 400px at 80% 0%,#1b4a42,#0b211d 70%);
    color:#eaf1ec;font:400 1.0625rem/1.65 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  }
  main{max-width:34rem;text-align:center}
  .radio{
    display:grid;place-items:center;width:5rem;height:5rem;margin:0 auto 1.5rem;
    border:1px solid #f3b54a55;border-radius:50%;background:#071916;color:#f3b54a;
    font-size:2.2rem;box-shadow:0 0 40px #f3b54a22 inset;
  }
  p.eyebrow{margin:0 0 .6rem;color:#9dbab0;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  h1{margin:0;font-family:"Zilla Slab",Georgia,serif;font-size:clamp(2rem,7vw,3rem);line-height:1.05;letter-spacing:-.02em}
  p.texto{margin:1rem 0 1.8rem;color:#c3d6cf}
  a.boton{
    display:inline-flex;align-items:center;gap:.5rem;min-height:2.9rem;padding:.6rem 1.2rem;
    border-radius:.75rem;background:#f3b54a;color:#1b2a25;font-weight:700;text-decoration:none;
  }
  a.boton:hover{background:#ffc76a}
  a.boton:focus-visible{outline:3px solid #fff;outline-offset:3px}
  small{display:block;margin-top:1.4rem;color:#7fa095;font-size:.8rem}
</style>
</head>
<body>
<main>
  <div class="radio" aria-hidden="true">📻</div>
  <p class="eyebrow">Error 404</p>
  <h1>Esta frecuencia no existe</h1>
  <p class="texto">Puede que el enlace esté mal escrito o que la reseña se haya mudado de dial. Vuelve a la radio y elige un cuento.</p>
  <a class="boton" href="/SalaInfantil/">Volver al dial</a>
  <small>Biblioteca en onda corta · Sala infantil</small>
</main>
</body>
</html>
